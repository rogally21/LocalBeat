# fatto da Vuoler21
name: Build LocalBeat

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Setup project
        run: bash setup.sh

      - name: Build APK
        run: bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBeat-Android-APK
          path: dist/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Setup project
        run: ./setup.ps1
        shell: pwsh

      - name: Build Windows
        run: ./build.ps1 windows
        shell: pwsh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LocalBeat-Windows
          path: dist/LocalBeat-Windows
          if-no-files-found: error
